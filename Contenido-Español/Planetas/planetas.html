<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajero del sistema solar en 3D</title>
    <link rel="stylesheet" href="Planetas.css">
</head>

<body>

    <div class="estrellas"></div>
    <div class="estrellas estrellas1"></div>
    <div class="estrellas estrellas2"></div>
    <div class="estrellas estrellas3"></div>    

    <!-- Título superior flotando arriba del planeta 3D -->
    <div id="planetTitle">¿Dónde deseas ir?</div>

    <button id="prevArrow" class="nav-arrow hidden" title="Previous Planet">&#8592;</button>
    <button id="nextArrow" class="nav-arrow" title="Next Planet">&#8594;</button>

    <!-- Contenedor inferior (Botón de Viajar y Nombre del planeta) -->
    <div id="planetInfoContainer">
        <button id="travelBtn" class="travel-btn">Viajar</button>
        <div id="planetLabel">La Luna</div>
    </div>

    <!-- Librerías de Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Tu archivo JavaScript -->
    <script src="planetas.js"></script>
</body>
</html>
