<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System Traveler</title>
    <link rel="stylesheet" href="Planetas.css">
</head>

<body>

    <div class="estrellas"></div>
    <div class="estrellas estrellas1"></div>
    <div class="estrellas estrellas2"></div>
    <div class="estrellas estrellas3"></div>    

    <!-- Flechas de navegación y contenedor de información/botón -->
    <button id="prevArrow" class="nav-arrow hidden" title="Previous Planet">&#8592;</button>
    <button id="nextArrow" class="nav-arrow" title="Next Planet">&#8594;</button>
    
    <div id="planetInfoContainer">
        <div id="planetLabel">The Moon</div>
        <button id="travelBtn" class="travel-btn">Travel</button>
    </div>

    <!-- Librerías de Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Tu archivo JavaScript -->
    <script src="planetas.js"></script>
</body>
</html>
